[package]
name = "nas-analyzer"
description = "NAS Storage Analyzer - storage analysis and reporting for UGREEN NAS via Docker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
age = "0.12.1"
fssecure = { path = "../fssecure" }
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-core.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rusqlite.workspace = true
rustix.workspace = true
sha2.workspace = true
argon2.workspace = true
uuid.workspace = true
jiff.workspace = true
cron.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
lettre.workspace = true
rand.workspace = true
hex.workspace = true
hmac.workspace = true
base64.workspace = true
zip.workspace = true
globset.workspace = true
percent-encoding.workspace = true
memchr.workspace = true
jsonschema.workspace = true
ipnet.workspace = true
num-traits.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
flate2.workspace = true
ureq.workspace = true
tempfile.workspace = true

[dev-dependencies]

[[bench]]
name = "resource_budget"
harness = false

[features]
default = []
# Enabled only in isolated security/integration tests; never in release builds
# shipped to users. Allows tests to inject controlled delays/faults.
testkit = []
