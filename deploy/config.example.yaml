# Deployment-only security boundary. Dynamic settings live in control.sqlite.
config_version: 2
server:
  listen: "0.0.0.0:8080"
  default_timezone: UTC
  trusted_proxy_cidrs: []
  allow_insecure_lan_http: true
storage:
  data_dir: /data
  approved_output_roots:
    - /data/exports
  data_budget_bytes: "21474836480"
  hash_cache_budget_bytes: "2147483648"
approved_mounts:
  - key: main
    container_path: /sources/main
    writable: false
    allow_submounts: false
security:
  allow_write_operations: false
  setup_token_minutes: 30
  session_idle_minutes: 30
  session_absolute_hours: 24
  reauth_minutes: 5
resources:
  max_running_scans: 1
  max_queued_scans: 20
  metadata_workers: 2
  hash_workers: 1
  hash_read_limit_mib_s: 30
  max_open_files: 128
  # Soft process budgets; not hard RSS limits. See specification 15.9.
  api_memory_budget_mib: 128
  worker_memory_budget_mib: 512
  max_parallel_exports: 1
sampling:
  interval_minutes: 60
  raw_retention_days: 180
  daily_retention_days: 1825
